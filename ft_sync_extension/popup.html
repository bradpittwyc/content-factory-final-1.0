<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
    h3 { margin-top: 0; font-size: 14px; color: #f59e0b; display: flex; items-center; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.4; }
    button { width: 100%; padding: 10px; background: linear-gradient(135deg, #f59e0b, #e11d48); color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    button:hover { opacity: 0.9; transform: scale(0.98); }
    #status { font-size: 11px; margin-top: 10px; color: #10b981; font-weight: 500; text-align: center; }
  </style>
</head>
<body>
  <h3>⚡ FT 凭证一键同步</h3>
  <p>一键将 Chrome 已登录的全部完整 FT 会话授权凭证同步到本地 Content Factory 后台。</p>
  <button id="btnSync">一键同步所有凭证到后台</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
